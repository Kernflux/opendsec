[project]
name = "opendsec"
version = "0.11.0"
description = "Python SDK for OpenDsec sandbox infrastructure"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"] # Apache-2.0, unlike the server (AGPL-3.0; see NOTICE)
readme = "README.md"
dependencies = ["grpcio>=1.73.1", "protobuf>=6.31,<8", "googleapis-common-protos>=1.60"]

[project.urls]
Source = "https://github.com/kernflux/opendsec"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opendsec*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
