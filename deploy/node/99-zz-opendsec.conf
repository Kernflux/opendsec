# OpenDsec node sysctls (installed by install.sh). Named to sort after
# 99-sysctl.conf (-> /etc/sysctl.conf), which some cloud images use to set
# vm.swappiness = 0; install.sh also comments that line out.
# pause_reclaim needs swappiness > 0: cgroup reclaim takes no anonymous
# memory at 0 (SPEC §21); harmless on a node without swap.
vm.swappiness = 10
# What tuned's virtual-guest profile used to set (install.sh disables tuned).
vm.dirty_ratio = 30
vm.dirty_background_ratio = 10
