# Written by deploy/node/install.sh (OpenDsec, SPEC §33.2). Messages every
# sandbox causes (its loop disk and that disk's ext4 mount, its overlay, its
# host-side links) stay in the journal, which is size-capped, and are not
# copied to /var/log/syslog and kern.log, which grow until the weekly
# rotation and filled the root disk at ~1.8 GB a day under load.
if $programname == "kernel" and (re_match($msg, "loop[0-9]+: detected capacity change") or re_match($msg, "EXT4-fs \\(loop[0-9]+\\)") or re_match($msg, "EXT4-fs (un)?mount: [0-9]+ callbacks suppressed") or ($msg contains "overlayfs: null uuid detected") or ($msg contains "overlayfs: \"xino\" feature enabled")) then stop
if $programname == "systemd-networkd" and re_match($msg, "^ ?ds[a-z0-9]*: ") then stop
